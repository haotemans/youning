# yuantuan 服务器配置文件 —— 部署在 deploy/ 下,挂到容器 /app/config.toml
# 与本地版区别:
#   listen_addr / webui host 从 127.0.0.1 改为 0.0.0.0(容器对外暴露需要)
#   容器外仍只绑 127.0.0.1:8085,公网不可达,SSH 隧道访问

[consolidation]
daily_time = "03:00"
enabled = true
run_on_startup = false

[data]
dir = "data"

[log]
level = "info"

[meme]
steal_enabled = true

[napcat]
enabled = true
listen_addr = "0.0.0.0:6199"
# ⚠ 生产部署时替换;保留与 NapCat WebUI 中配置一致
token = "REPLACE_WITH_STRONG_TOKEN"

[pipeline]
decision_cost_per_min_init = 30
per_chat_queue_cap = 32
self_msg_ids_cap = 512

[prefilter]
self_msg_cap = 12
window_secs = 60

[security]
# 超级管理员 QQ（bot 主人）：只有该 QQ 能执行群管理（主理人 / 撤回 / 禁言）操作；
# 群主 / 群管理员不再拥有主理人权限。0 或删除该行退回原兼容模式。
super_admin_qq = 3827429173

[webui]
host = "0.0.0.0"
port = 8085
