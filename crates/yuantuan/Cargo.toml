[package]
name = "yuantuan"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-plugin-anysearch = { path = "../../plugins/anysearch", optional = true }
yuantuan-plugin-api = { path = "../plugin-api" }
yuantuan-core = { path = "../core" }
yuantuan-adapter-qq = { path = "../adapter-qq" }
yuantuan-webui = { path = "../webui" }
yuantuan-plugin-hello = { path = "../../plugins/hello", optional = true }
yuantuan-plugin-social-media = { path = "../../plugins/social-media", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlx.workspace = true
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
plugin-anysearch = ["dep:yuantuan-plugin-anysearch"]
default = ["plugin-hello", "plugin-social-media", "plugin-anysearch"]
plugin-hello = ["dep:yuantuan-plugin-hello"]
plugin-social-media = ["dep:yuantuan-plugin-social-media"]

[build-dependencies]
toml = "0.8"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-hello"
feature = "plugin-hello"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-social-media"
feature = "plugin-social-media"

[[package.metadata.yuantuan.plugins]]
dependency = "yuantuan-plugin-anysearch"
feature = "plugin-anysearch"
