[package]
name = "yuantuan-plugin-anysearch"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-plugin-api = { path = "../../crates/plugin-api" }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time"] }
futures-util = "0.3"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
