[package]
name = "yuantuan-plugin-moderator"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-plugin-api = { path = "../../crates/plugin-api" }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
