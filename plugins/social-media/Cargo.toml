[package]
name = "yuantuan-plugin-social-media"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-plugin-api = { path = "../../crates/plugin-api" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "time"] }
url = "2"
sm3 = "0.5"
rand = "0.8"

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
