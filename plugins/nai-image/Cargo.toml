[package]
name = "yuantuan-plugin-nai-image"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-plugin-api = { path = "../../crates/plugin-api" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "time"] }
url = "2"
