[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/plugin-api",
    "crates/adapter-qq",
    "crates/webui",
    "crates/yuantuan",
    "plugins/hello",
    "plugins/anysearch",
    "plugins/social-media",
]

[workspace.dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
